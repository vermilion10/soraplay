services:
  soraplay:
    build: .
    image: soraplay:latest
    container_name: soraplay
    restart: unless-stopped
    # Runs as the host user so it can write ./data, with a read-only
    # filesystem and no Linux capabilities.
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: .env
    environment:
      NONTON_DATA: /data
      PREFETCH_DIR: /saved
    volumes:
      - ./data:/data
      # Saved episodes; set SAVED_DIR in .env to keep them on another disk.
      - ${SAVED_DIR:-./saved}:/saved
    ports:
      # Bound to localhost only; expose it with `tailscale serve` (see README).
      - "127.0.0.1:8787:8787"
